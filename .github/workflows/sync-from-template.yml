name: Sync from template

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync from template
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: clinasama/mosaic-site
          upstream_branch: main
          source_gh_token: ${{ secrets.GITHUB_TOKEN }}
          target_gh_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "chore: sync framework from mosaic-site template"
          pr_labels: template-sync
          pr_branch_name_prefix: "chore/template_sync"
          is_pr_cleanup: true